<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10251e">
    <meta name="description" content="The Christmas countdown is on. See how long until Christmas Eve, 2026.">
    <title>Christmas Countdown 2026</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10251e;
        color: #fff8e9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 44%, rgb(37 83 62 / 55%) 0, transparent 53%),
          linear-gradient(145deg, #10251e, #0b1a17 72%);
      }

      body::before,
      body::after {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
      }

      body::before {
        background-image:
          radial-gradient(2px 2px at 12% 18%, #fff8e980 50%, transparent),
          radial-gradient(2px 2px at 82% 26%, #fff8e980 50%, transparent),
          radial-gradient(1.5px 1.5px at 68% 76%, #fff8e980 50%, transparent),
          radial-gradient(2px 2px at 25% 82%, #fff8e980 50%, transparent),
          radial-gradient(1.5px 1.5px at 92% 61%, #fff8e980 50%, transparent);
      }

      main {
        width: min(100% - 32px, 760px);
        padding: clamp(32px, 8vw, 72px) clamp(20px, 7vw, 64px);
        text-align: center;
        border: 1px solid rgb(255 248 233 / 12%);
        border-radius: 28px;
        background: rgb(10 27 22 / 58%);
        box-shadow: 0 28px 90px rgb(0 0 0 / 28%), inset 0 1px rgb(255 255 255 / 5%);
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #e5bf74;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.75rem);
        font-weight: 400;
        letter-spacing: -0.045em;
        line-height: 1.05;
      }

      .subtitle {
        margin: 16px 0 38px;
        color: #d7ddcf;
        font-size: clamp(0.95rem, 2.8vw, 1.1rem);
        line-height: 1.6;
      }

      .countdown {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(8px, 3vw, 20px);
      }

      .unit {
        min-width: 0;
        padding: clamp(14px, 3.5vw, 22px) 6px;
        border: 1px solid rgb(255 248 233 / 10%);
        border-radius: 16px;
        background: rgb(255 248 233 / 4%);
      }

      .value {
        display: block;
        color: #fff8e9;
        font-variant-numeric: tabular-nums;
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 600;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .label {
        display: block;
        margin-top: 10px;
        color: #bdc9bc;
        font-size: clamp(0.62rem, 2vw, 0.75rem);
        font-weight: 600;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .target {
        margin: 28px 0 0;
        color: #cbd4c8;
        font-size: 0.9rem;
      }

      .target strong {
        color: #f0d7a4;
        font-weight: 600;
      }

      .tree {
        margin-top: 36px;
        color: #e5bf74;
        font-size: 1.4rem;
        line-height: 1;
      }

      .finished {
        grid-column: 1 / -1;
        padding: 28px 12px;
        color: #f0d7a4;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.6rem, 5vw, 2.5rem);
      }

      @media (max-width: 420px) {
        main {
          padding-inline: 16px;
          border-radius: 22px;
        }

        .subtitle {
          margin-bottom: 28px;
        }

        .unit {
          border-radius: 12px;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .tree {
          animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
          from { text-shadow: 0 0 8px rgb(229 191 116 / 15%); }
          to { text-shadow: 0 0 22px rgb(229 191 116 / 65%); }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The most wonderful time of the year</p>
      <h1>Christmas is coming</h1>
      <p class="subtitle">A little more waiting, a lot more magic.</p>

      <section class="countdown" aria-label="Time remaining until Christmas">
        <div class="unit"><span class="value" id="days">--</span><span class="label">Days</span></div>
        <div class="unit"><span class="value" id="hours">--</span><span class="label">Hours</span></div>
        <div class="unit"><span class="value" id="minutes">--</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="value" id="seconds">--</span><span class="label">Seconds</span></div>
      </section>

      <p class="target">Counting down to <strong>24 December 2026, 12:10</strong> <span>(Europe/Vienna)</span></p>
      <div class="tree" aria-hidden="true">✦</div>
      <p id="announcement" class="finished" aria-live="polite" hidden>Merry Christmas!</p>
    </main>

    <script>
      const target = new Date("2026-12-24T12:10:00+01:00").getTime();
      const units = {
        days: 24 * 60 * 60 * 1000,
        hours: 60 * 60 * 1000,
        minutes: 60 * 1000,
        seconds: 1000
      };

      function updateCountdown() {
        const remaining = target - Date.now();
        if (remaining <= 0) {
          document.querySelector(".countdown").hidden = true;
          document.getElementById("announcement").hidden = false;
          return;
        }

        let remainder = remaining;
        for (const [unit, duration] of Object.entries(units)) {
          const value = Math.floor(remainder / duration);
          remainder %= duration;
          document.getElementById(unit).textContent = String(value).padStart(2, "0");
        }
      }

      updateCountdown();
      window.setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
